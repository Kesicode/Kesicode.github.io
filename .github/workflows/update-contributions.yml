name: Update Contributions Data

on:
  schedule:
    # Runs daily at 18:30 UTC (midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit contributions.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch contributions from GitHub GraphQL API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_contributions.py

      - name: Commit and push contributions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          # Only commit if contributions.json actually changed
          git diff --staged --quiet && echo "No changes to commit" || \
            (git commit -m "chore: update contribution data [skip ci]" && git push)
