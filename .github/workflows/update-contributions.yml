name: Update Contributions Data (DEPRECATED)

# This workflow is superseded by sync-contributions.yml which pulls data
# directly from Kesicode/Kesicode as the single source of truth.
# Kept here for reference / manual fallback use only.

on:
  workflow_dispatch: # Manual trigger only — automatic schedule removed

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch contributions (no token needed)
        run: python fetch_contributions.py

      - name: Commit and push contributions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: refresh contribution data [skip ci]" && git push)
