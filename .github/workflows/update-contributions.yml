name: Update Contributions Data

on:
  schedule:
    # Run every 10 minutes — keeps data fresh within ~10 minutes of any push
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch contributions (no token needed)
        run: python fetch_contributions.py

      - name: Commit and push contributions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: refresh contribution data [skip ci]" && git push)
